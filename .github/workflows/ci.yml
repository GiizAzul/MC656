name: Integração Contínua (Build, Lint, Tests)

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Instalar o uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true # Faz cache das dependências para rodar ainda mais rápido
        cache-dependency-glob: "A2/requirements.txt"

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Build (Instalar dependências)
      run: |
        cd A2
        uv venv .venv  # Cria o ambiente virtual na pasta .venv
        uv pip install -r requirements.txt # Instala as dependências lendo o requirements.txt usando o uv

  lint:
    runs-on: ubuntu-latest
    needs: build # Faz o lint só começar se o build passar
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
    - name: Instalar o uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "A2/requirements.txt"
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Análise Estática com Ruff
      run: |
        cd A2
        uv venv .venv
        uv pip install -r requirements.txt
        # Roda o ruff chamando direto da pasta do ambiente virtual
        # Falha o pipeline ao encontrar erros de sintaxe ou más práticas
        .venv/bin/ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: build # Faz o teste só começar se o build passar
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
    - name: Instalar o uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "A2/requirements.txt"
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Testes Automatizados e Cobertura
      run: |
        cd A2
        uv venv .venv
        uv pip install -r requirements.txt
        # Roda o pytest chamando direto da pasta do ambiente virtual
        # Exibe a porcentagem de código testado no log
        .venv/bin/pytest --cov=src --cov-report=term

