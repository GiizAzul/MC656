{% extends "base.html" %}

{% block content %}
<div class="login-box">
    <h1>Criar Nova Conta</h1>
    
    {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
    {% endif %}

    <form action="/cadastro" method="POST">
        <div class="form-group">
            <label for="tipo_conta">Tipo de Conta</label>
            <select id="tipo_conta" name="tipo_conta" required>
                <option value="" disabled {% if not tipo_conta_selecionada %}selected{% endif %}>Selecione seu perfil...</option>
                <option value="CACO_ESTUDANTE" {% if tipo_conta_selecionada == 'CACO_ESTUDANTE' %}selected{% endif %}>Estudante Unicamp (CACo)</option>
                <option value="CACO_GESTAO" {% if tipo_conta_selecionada == 'CACO_GESTAO' %}selected{% endif %}>Membro da Gestão (CACo)</option>
                <option value="AUSTRALIA_ELEITOR" {% if tipo_conta_selecionada == 'AUSTRALIA_ELEITOR' %}selected{% endif %}>Eleitor (Austrália)</option>
                <option value="AUSTRALIA_CANDIDATO" {% if tipo_conta_selecionada == 'AUSTRALIA_CANDIDATO' %}selected{% endif %}>Candidato Federal (Austrália)</option>
                <option value="BOTC_JOGADOR" {% if tipo_conta_selecionada == 'BOTC_JOGADOR' %}selected{% endif %}>Jogador (Blood on the Clocktower)</option>
                <option value="BOTC_STORYTELLER" {% if tipo_conta_selecionada == 'BOTC_STORYTELLER' %}selected{% endif %}>Storyteller / Mestre (BoTC)</option>
            </select>
        </div>     

        <div class="form-group">
            <label for="nome_real">Nome Completo</label>
            <input type="text" id="nome_real" name="nome_real" value="{{ nome_real_digitado | default('') }}" required>
        </div>

        <div class="form-group">
            <label for="username">Username (Login)</label>
            <input type="text" id="username" name="username" value="{{ username_digitado | default('') }}" required>
        </div>

        <!-- Campo condicional para RA. Usaremos JS no futuro para esconder se não for estudante -->
        <div class="form-group">
            <label for="ra">RA (Apenas para estudantes CACo)</label>
            <input type="number" id="ra" name="ra" placeholder="123456" value="{{ ra_digitado | default('') }}">
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <!-- Senhas são limpas por segurança -->
            <input type="password" id="senha" name="senha" required>
        </div>

        <div class="form-group">
            <label>Confirme a Senha</label>
            <input type="password" name="senha_confirma" required>
        </div>

        <button type="submit" class="btn-primary mt-2">Registrar e Entrar</button>
        <a href="/" class="btn-secondary mt-2">Voltar ao Login</a>
    </form>
</div>
{% endblock %}
