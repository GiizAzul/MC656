{% extends "base.html" %}

{% block content %}
<main class="card">
    <h2>Criar Nova Conta ou Vincular Escopo</h2>
    <p class="text-muted mb-2">
        Dica: Se você já possui uma conta, use o mesmo <strong>Username</strong> e <strong>Senha</strong> para habilitar um novo contexto eleitoral no seu perfil!
    </p>

    {% if erro %}
    <div class="alert-error" role="alert">
        {{ erro }}
    </div>
    {% endif %}

    <form action="/cadastro" method="POST" id="form-cadastro">
        <div class="form-group">
            <label for="tipo_conta">Tipo de Conta / Contexto</label>
            <select id="tipo_conta" name="tipo_conta" required onchange="atualizarVisibilidadeRA()">
                <option value="" disabled {% if not tipo_conta_selecionada %}selected{% endif %}>Selecione seu perfil...</option>
                <option value="CACO_ESTUDANTE" {% if tipo_conta_selecionada == 'CACO_ESTUDANTE' %}selected{% endif %}>Estudante Unicamp (CACo)</option>
                <option value="CACO_GESTAO" {% if tipo_conta_selecionada == 'CACO_GESTAO' %}selected{% endif %}>Membro da Gestão (CACo)</option>
                <option value="AUSTRALIA_ELEITOR" {% if tipo_conta_selecionada == 'AUSTRALIA_ELEITOR' %}selected{% endif %}>Eleitor (Austrália)</option>
                <option value="AUSTRALIA_CANDIDATO" {% if tipo_conta_selecionada == 'AUSTRALIA_CANDIDATO' %}selected{% endif %}>Candidato Federal (Austrália)</option>
                <option value="BOTC_JOGADOR" {% if tipo_conta_selecionada == 'BOTC_JOGADOR' %}selected{% endif %}>Jogador (Blood on the Clocktower)</option>
                <option value="BOTC_STORYTELLER" {% if tipo_conta_selecionada == 'BOTC_STORYTELLER' %}selected{% endif %}>Storyteller / Mestre (BoTC)</option>
            </select>
        </div>

        <div class="form-group" id="grupo-ra" style="display: none;">
            <label for="ra">RA (Registro Acadêmico — Apenas números positivos)</label>
            <input type="text"
                   id="ra"
                   name="ra"
                   inputmode="numeric"
                   pattern="[0-9]+"
                   placeholder="Ex: 288808"
                   value="{{ ra_digitado | default('', true) }}"
                   onkeydown="if(['-','+','.',',','e','E'].includes(event.key)) event.preventDefault();"
                   oninput="this.value = this.value.replace(/[^0-9]/g, '');">
        </div>

        <div class="form-group">
            <label for="nome_real">Nome Completo</label>
            <input type="text" id="nome_real" name="nome_real" value="{{ nome_real_digitado | default('', true) }}" required>
        </div>

        <div class="form-group">
            <label for="username">Username (Login)</label>
            <input type="text" id="username" name="username" value="{{ username_digitado | default('', true) }}" required>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <div class="form-group">
            <label for="senha_confirma">Confirme a Senha</label>
            <input type="password" id="senha_confirma" name="senha_confirma" required>
        </div>

        <button type="submit" class="btn-primary">Finalizar Cadastro</button>
    </form>

    <div class="footer-links mt-2">
        <p>Já possui conta? <a href="/">Voltar para o Login</a></p>
    </div>
</main>

<script>
function atualizarVisibilidadeRA() {
    const selectTipo = document.getElementById("tipo_conta");
    const grupoRa = document.getElementById("grupo-ra");
    const inputRa = document.getElementById("ra");
    if (!selectTipo || !grupoRa || !inputRa) return;

    if (selectTipo.value === "CACO_ESTUDANTE") {
        grupoRa.style.display = "block";
        inputRa.setAttribute("required", "required");
    } else {
        grupoRa.style.display = "none";
        inputRa.removeAttribute("required");
        inputRa.value = "";
    }
}
document.addEventListener("DOMContentLoaded", atualizarVisibilidadeRA);
</script>
{% endblock %}
